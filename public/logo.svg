  <text x="60" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" fill="#c7d2fe" text-anchor="middle" letter-spacing="2">SAMVAD AI</text>
